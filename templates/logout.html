{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
    <h2>Would you like to logout?</h2>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
</div> 
{% endblock %}
