{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0
"
    />
    <title>{% block title %}Swaped{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body>
    <header>
      <nav class="navBar">

        <ul class="navLeft">
          <li><a href="/"><img class="logo" src="{% static 'images/logo.png' %}" alt="Logo" /></a></li>
          <li class="navSearchInput">
            <form method="get" action="{% url 'main' %}">
              <input type="text" name="search" placeholder="Search..." />
            </form>
          </li>
        </ul>

        <ul class="navRight">
          {% if user.is_authenticated %}
          <li><a href="{% url 'profile' %}">Profile</a></li>
          <li>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit">Logout</button>
            </form>
          </li>
          {% else %}
          <li><a href="{% url 'login' %}">Login</a></li>
          <li><a href="{% url 'registration' %}">Sign Up</a></li>
          {% endif %}
        </ul>
      </nav>
      {% block navCategories %}
      {% endblock %}
      {% block header %}
      {% endblock %}
    </header>

    <main>
      {% block content %}

      {% endblock %}
    </main>

    <footer>
    
    </footer>
  </body>
</html>
