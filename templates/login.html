{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
    <h1 class="mainTitle">Вход</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Войти</button>
    </form>
    <p>Нет аккаунта? <a href="{% url 'registration' %}">Зарегистрироваться</a></p>
</div>
{% endblock %}
